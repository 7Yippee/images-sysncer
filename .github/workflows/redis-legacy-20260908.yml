name: Redis legacy 6.2.16 for expense
on:
  push:
    branches: [main]
    paths: [.github/workflows/redis-legacy-20260908.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: registry.cn-guangzhou.aliyuncs.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Mirror fixed amd64 images
        run: |
          set -euo pipefail
          skopeo copy --all --preserve-digests docker://docker.io/bitnamilegacy/redis:6.2.16 docker://registry.cn-guangzhou.aliyuncs.com/tools_y/redis:6.2.16
          skopeo copy --all --preserve-digests docker://docker.io/bitnamilegacy/redis-sentinel:6.2.16 docker://registry.cn-guangzhou.aliyuncs.com/tools_y/redis-sentinel:6.2.16
          skopeo inspect docker://registry.cn-guangzhou.aliyuncs.com/tools_y/redis:6.2.16
          skopeo inspect docker://registry.cn-guangzhou.aliyuncs.com/tools_y/redis-sentinel:6.2.16
